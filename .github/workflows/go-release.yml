name: go release

# Static binaries for every OS/arch, Trivy-scanned, attached to the GitHub release.
# Caller triggers on push of v* tags and grants `contents: write`.
on:
  workflow_call:
    inputs:
      binary-name:
        type: string
        required: true
      package:
        description: Go package to build
        type: string
        default: .

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          NAME: ${{ inputs.binary-name }}
          PKG: ${{ inputs.package }}
        run: |
          export CGO_ENABLED=0  # static on every target, incl. native amd64
          export GOARM=7  # only read when GOARCH=arm
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            export GOOS=${target%/*} GOARCH=${target#*/}
            out="dist/${NAME}-${GOOS}-${GOARCH}"
            [ "$GOARCH" = arm ] && out="${out}v7"
            [ "$GOOS" = windows ] && out="$out.exe"
            go build -ldflags "-s -w" -o "$out" "$PKG"
          done
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs  # reads the Go module info embedded in each binary
          scan-ref: dist
          severity: HIGH,CRITICAL
          exit-code: '1'
      # An older release line must not move the "Latest" release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)
          highest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --notes-start-tag "$prev" \
            --latest="$([ "$highest" = "$GITHUB_REF_NAME" ] && echo true || echo false)"
