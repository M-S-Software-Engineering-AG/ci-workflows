name: image release

# Language-agnostic: releases the <app-version>-Y.Z tag image-auto-tag pushed. Builds docker-bake.hcl with that
# IMAGE_REVISION, Trivy-scans every target, pushes to ghcr, moves the rolling <app-version>-Y tag, creates the GitHub
# release. Caller triggers on push of tags '*-[0-9]+.[0-9]+', grants `contents: write` + `packages: write` and passes
# `secrets: inherit` for AUTOMATION_APP_KEY.
on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: image-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # bake reads IMAGE_REVISION from the environment over the file default.
      - name: Check tag against docker-bake.hcl
        run: |
          echo "IMAGE_REVISION=${VERSION##*-}" >> "$GITHUB_ENV"
          IMAGE_REVISION=${VERSION##*-} docker buildx bake -f docker-bake.hcl --print \
            | jq -e --arg v "$VERSION" '[.target[].tags[] | endswith(":" + $v)] | any' >/dev/null \
            || { echo "::error::docker-bake.hcl at $VERSION doesn't produce a :$VERSION tag (app version mismatch?)"; exit 1; }
      # Scan before push: load one platform locally; the push below reuses the build cache.
      - name: Build for scan
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          set: '*.platform=linux/amd64'
          load: true
      - uses: aquasecurity/setup-trivy@v0.3.1
      # *-debug targets are skipped: same binary as their base target, plus a busybox shell for troubleshooting.
      - name: Trivy scan
        run: |
          mapfile -t images < <(docker buildx bake -f docker-bake.hcl --print \
            | jq -r '.target | to_entries[] | select(.key | endswith("-debug") | not) | .value.tags[0]')
          for image in "${images[@]}"; do
            trivy image --severity HIGH,CRITICAL --exit-code 1 "$image"
          done
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          push: true
      # The org ruleset protect-tags lets only the app create and move tags.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - name: Move rolling tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          prev=$(gh release view --json tagName --jq .tagName 2>/dev/null) || prev=
          git tag -f "${VERSION%.*}"
          git push -f "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${VERSION%.*}"
          gh release create "$VERSION" --generate-notes ${prev:+--notes-start-tag "$prev"} --latest
