name: common renovate

# Caller keeps the triggers (schedule, push to main, workflow_dispatch, workflow_run of its CI workflow)
# and calls this with `secrets: inherit` for AUTOMATION_APP_KEY.
on:
  workflow_call:
    inputs:
      allowed-commands:
        description: JSON array for RENOVATE_ALLOWED_COMMANDS (postUpgradeTasks)
        type: string
        default: '[]'

jobs:
  renovate:
    # Only a trigger filter, not a security gate: the org ruleset protect-renovate-branches lets only the app push renovate/**
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       startsWith(github.event.workflow_run.head_branch, 'renovate/'))
    runs-on: ubuntu-latest
    concurrency:
      group: renovate
      cancel-in-progress: false
    permissions: {}  # Renovate acts as the GitHub App, not GITHUB_TOKEN
    steps:
      - name: Resolve repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          owner: ${{ github.repository_owner }}
          # ci-workflows too: Renovate reads the shared presets from it
          repositories: |
            ${{ steps.repo.outputs.name }}
            ci-workflows
      - name: Resolve git author
        id: author
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          echo "value=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - uses: renovatebot/github-action@v46.3.15
        with:
          token: ${{ steps.app.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: ${{ steps.author.outputs.value }}
          RENOVATE_ALLOWED_COMMANDS: ${{ inputs.allowed-commands }}
          LOG_LEVEL: ${{ vars.RENOVATE_LOG_LEVEL || 'info' }}  # set the repo variable to 'debug' to troubleshoot
