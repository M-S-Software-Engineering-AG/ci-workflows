name: image daily scan

# Trivy scan of the published :latest and :latest-debug of every docker-bake.hcl target, without rebuilding.
# Caller keeps the schedule.
on:
  workflow_call:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/setup-trivy@v0.3.1
      - name: Trivy scan
        env:
          TRIVY_DETECTION_PRIORITY: comprehensive
        run: |
          mapfile -t images < <(docker buildx bake -f docker-bake.hcl --print \
            | jq -r '.target[].tags[]' | grep -E ':latest(-debug)?$')
          fail=0
          for image in "${images[@]}"; do
            trivy image --severity HIGH,CRITICAL --exit-code 1 "$image" || fail=1
          done
          exit $fail
